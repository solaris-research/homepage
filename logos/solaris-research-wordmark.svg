<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc">
  <title id="title">Solaris Research wordmark</title>
  <desc id="desc">Transparent wordmark in the site's dark blue color.</desc>
  <style>
    .wordmark {
      fill: #092544;
      font-family: 'JetBrains Mono', 'Inter', 'SF Mono', 'Fira Code', monospace;
      font-size: 180px;
      font-weight: 600;
      letter-spacing: -0.04em;
    }
  </style>
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" class="wordmark">Solaris Research</text>
</svg>
